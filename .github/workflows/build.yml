name: Build & Test Rentities 1.21.11

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up JDK 21 (Required for Gradle 8.x + MC 1.21.x)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Step 3: Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      # Step 4: Repair corrupt wrapper binary on the runner
      - name: Repair Gradle Wrapper
        run: gradle wrapper --gradle-version 8.11.1

      # Step 5: Grant execute permission for Gradle wrapper
      - name: Make gradlew Executable
        run: chmod +x ./gradlew

      # Step 6: Build project
      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      # Step 7: Upload build artifacts (.jar files)
      - name: Upload Mod Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rentities-1.21.11-build
          path: build/libs/*.jar
          retention-days: 7
