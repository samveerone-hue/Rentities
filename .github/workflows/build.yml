name: Build & Test Rentities 1.21.11

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java Development Kit (JDK 25 required for Minecraft)
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      # Step 3: Setup Gradle & Caching
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      # Step 4: Grant execute permission for Gradle wrapper
      - name: Make gradlew Executable
        run: chmod +x ./gradlew

      # Step 5: Replace corrupt gradle-wrapper.jar with a clean working copy
      - name: Fix Corrupt Gradle Wrapper JAR
        run: |
          wget -O gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.11.1/gradle/wrapper/gradle-wrapper.jar

      # Step 6: Build project and run tests
      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      # Step 7: Upload build artifacts (.jar files)
      - name: Upload Mod Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rentities-1.21.11-build
          path: build/libs/*.jar
          retention-days: 7
