name: Gemini Coding Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "What should Gemini implement?"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  gemini:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Gemini
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            You are an autonomous software engineer working on this repository.

            Task:
            ${{ inputs.task }}

            Instructions:
            1. Inspect the repository before changing anything.
            2. Understand the existing architecture and coding conventions.
            3. Implement the requested change.
            4. Add or update tests where appropriate.
            5. Run the relevant tests, linting, and type checks.
            6. Fix failures caused by your changes.
            7. Do not make unrelated changes.
            8. Create a new git branch for the work.
            9. Commit the changes with a clear commit message.
            10. Push the branch to GitHub.
            11. Create a pull request against the default branch.
            12. Include a useful PR title and description explaining what changed
                and what tests were run.
